<link rel="canonical" href="https://www.loveandlayover.in/destinations/">
<script>
  // The old builder lived here; forward to the destination guide it would have shown.
  (function () {
    var G = {"australia":null,"azerbaijan":[3,5,7],"bali":[3,5,7],"bhutan":[3,5,7],"cambodia":[3,5,7],"dubai":[3,5,7],"egypt":null,"france":null,"georgia":[3,5,7],"germany":null,"greece":null,"hong-kong":[3,5,7],"iceland":null,"india":[3,5,7],"indonesia":[3,5,7],"italy":null,"japan":[3,5,7],"kazakhstan":[3,5,7],"macau":[3,5,7],"malaysia":null,"maldives":[3,5,7],"mexico":null,"nepal":[3,5,7],"oman":[3,5,7],"peru":null,"philippines":[3,5,7],"portugal":null,"qatar":[3,5,7],"singapore":[3,5,7],"south-korea":[3,5,7],"spain":null,"sri-lanka":[3,5,7],"taiwan":[3,5,7],"thailand":[3,5,7],"turkey":null,"uzbekistan":[3,5,7],"vietnam":[3,5,7]};
    var q = new URLSearchParams(location.search);
    var slug = (q.get('country') || '').trim().toLowerCase().replace(/&/g, 'and').replace(/[^a-z]+/g, '-').replace(/^-|-$/g, '');
    var target = '/destinations/';
    if (slug && Object.prototype.hasOwnProperty.call(G, slug)) {
      target = '/destinations/' + slug + '.html';
      var plans = G[slug], days = parseInt(q.get('duration'), 10);
      if (plans && days) {
        var pick = plans.filter(function (p) { return p <= days; }).pop() || plans[0];
        target += '#itinerary-' + pick;
      } else {
        target += '#itineraries';
      }
    }
    location.replace(target);
  })();
</script>
