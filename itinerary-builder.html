<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Itinerary Builder - Love and Layovers</title>
<meta name="description" content="Build your perfect Asia itinerary. Choose destination and duration for customized travel guides.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,900&family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
:root { --ink:#1a2332; --paper:#fefaf5; --accent:#ff6b35; --secondary:#f7931e; --shadow:rgba(26,35,50,.12); --maxw:1180px; }
* { margin:0; padding:0; box-sizing:border-box; }
html { scroll-behavior:smooth; }
body { font-family:'Outfit',sans-serif; background:var(--paper); color:var(--ink); overflow-x:hidden; line-height:1.6; }
h1,h2,h3,h4 { font-family:'Fraunces',serif; line-height:1.1; font-weight:900; letter-spacing:-.02em; }
a { color:inherit; text-decoration:none; }
img { max-width:100%; display:block; }
.wrap { max-width:var(--maxw); margin:0 auto; padding:0 24px; }
header { position:fixed; top:0; left:0; right:0; z-index:100; background:rgba(255,250,242,.92); backdrop-filter:blur(12px); box-shadow:0 2px 24px var(--shadow); }
nav { display:flex; align-items:center; justify-content:space-between; max-width:var(--maxw); margin:0 auto; padding:14px 24px; }
.logo { font-family:'Fraunces',serif; font-weight:900; font-size:1.3rem; color:var(--ink); }
.back-link { font-weight:600; color:var(--accent); }
.hero-page { padding:140px 0 60px; background:linear-gradient(135deg,var(--accent),var(--secondary)); color:#fff; }
.hero-page h1 { font-size:clamp(2.2rem,5vw,3.5rem); margin-bottom:12px; }
.hero-page p { font-size:1.1rem; opacity:.95; }
.selector-box { background:#fff; border-radius:18px; padding:40px; margin:60px 0; box-shadow:0 10px 40px var(--shadow); }
.selector-box h2 { font-size:1.5rem; margin-bottom:24px; }
.selector-row { margin-bottom:28px; }
.selector-row label { display:block; font-weight:600; margin-bottom:10px; font-size:.95rem; }
.selector-row select { width:100%; padding:12px 16px; border:2px solid #ddd; border-radius:8px; font-size:1rem; font-family:'Outfit',sans-serif; cursor:pointer; transition:.2s; }
.selector-row select:focus { border-color:var(--accent); outline:none; }
.duration-buttons { display:flex; gap:12px; flex-wrap:wrap; }
.duration-btn { padding:12px 28px; border:2px solid #ddd; background:#fff; border-radius:8px; cursor:pointer; font-weight:600; font-size:.95rem; transition:.2s; font-family:'Outfit',sans-serif; }
.duration-btn:hover { border-color:var(--accent); }
.duration-btn.active { background:var(--accent); color:#fff; border-color:var(--accent); }
.grid { display:grid; grid-template-columns:repeat(3,1fr); gap:32px; padding:60px 0; }
.card { background:#fff; border-radius:18px; overflow:hidden; box-shadow:0 10px 40px var(--shadow); transition:.3s; cursor:pointer; }
.card:hover { transform:translateY(-8px); box-shadow:0 22px 55px var(--shadow); }
.card-header { padding:32px 24px; background:linear-gradient(135deg,#ff9e1b,#ff5d3b); color:#fff; }
.card-header h3 { font-size:1.5rem; margin-bottom:8px; }
.card-header .duration { font-size:.95rem; opacity:.9; }
.card-header .badge { display:inline-block; background:rgba(255,255,255,.2); padding:4px 10px; border-radius:12px; font-size:.8rem; margin-top:8px; }
.card-body { padding:28px 24px; }
.card-body h4 { font-size:1.1rem; margin-bottom:8px; color:var(--ink); }
.card-body p { font-size:.95rem; color:#666; margin:0; line-height:1.5; }
.empty-state { grid-column:1/-1; padding:60px 20px; text-align:center; color:#999; }
.empty-state p { font-size:1.1rem; }
footer { background:var(--ink); color:#9fb0b5; padding:50px 0 30px; margin-top:60px; }
.foot { display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:20px; }
footer .logo { color:var(--paper); }
.foot-links { display:flex; gap:24px; flex-wrap:wrap; }
.foot-links a:hover { color:var(--secondary); }
.copy { text-align:center; margin-top:30px; padding-top:24px; border-top:1px solid rgba(255,255,255,.08); font-size:.85rem; }
@media(max-width:900px) {
  .grid { grid-template-columns:repeat(2,1fr); }
  .selector-box { padding:28px; }
}
@media(max-width:560px) {
  .hero-page { padding:100px 0 40px; }
  .grid { grid-template-columns:1fr; }
  .selector-box { padding:20px; }
  .duration-buttons { flex-direction:column; }
  .duration-btn { width:100%; }
}
</style>
</head>
<body>

<header>
  <nav>
    <a href="index.html" class="logo">Love and Layovers</a>
    <a href="index.html" class="back-link">← Back home</a>
  </nav>
</header>

<section class="hero-page">
  <div class="wrap">
    <h1>Plan Your Asia Itinerary</h1>
    <p>Explore 15+ destinations with customized guides. Choose your destination and trip length.</p>
  </div>
</section>

<div class="wrap">
  <div class="selector-box">
    <h2>Customize Your Trip</h2>
    
    <div class="selector-row">
      <label for="country-select">Select Country:</label>
      <select id="country-select">
        <option value="">All Countries</option>
        <option value="Singapore">🇸🇬 Singapore</option>
        <option value="Thailand">🇹🇭 Thailand</option>
        <option value="Vietnam">🇻🇳 Vietnam</option>
        <option value="South Korea">🇰🇷 South Korea</option>
        <option value="Cambodia">🇰🇭 Cambodia</option>
        <option value="Philippines">🇵🇭 Philippines</option>
        <option value="Indonesia">🇮🇩 Indonesia</option>
        <option value="Taiwan">🇹🇼 Taiwan</option>
        <option value="Hong Kong">🇭🇰 Hong Kong</option>
        <option value="Laos">🇱🇦 Laos</option>
        <option value="Myanmar">🇲🇲 Myanmar</option>
        <option value="India">🇮🇳 India</option>
        <option value="Nepal">🇳🇵 Nepal</option>
        <option value="Sri Lanka">🇱🇰 Sri Lanka</option>
        <option value="Maldives">🇲🇻 Maldives</option>
      </select>
    </div>

    <div class="selector-row">
      <label>Trip Duration:</label>
      <div class="duration-buttons">
        <button class="duration-btn active" data-duration="3">3 Days</button>
        <button class="duration-btn" data-duration="5">5 Days</button>
        <button class="duration-btn" data-duration="10">10 Days</button>
      </div>
    </div>
  </div>

  <div class="grid" id="itinerary-grid">
    <div class="empty-state"><p>Loading itineraries...</p></div>
  </div>
</div>

<footer>
  <div class="wrap">
    <div class="foot">
      <a href="index.html" class="logo">Love and Layovers</a>
      <div class="foot-links">
        <a href="index.html#videos">Videos</a>
        <a href="index.html#guides">Destinations</a>
        <a href="blog.html">Blog</a>
        <a href="faq.html">FAQ</a>
        <a href="index.html#contact">Contact</a>
      </div>
    </div>
    <div class="copy">&copy; <span id="yr"></span> Love and Layovers · Travel tips with heart ✈</div>
  </div>
</footer>

<script>
document.getElementById('yr').textContent = new Date().getFullYear();

let allItineraries = [];
let selectedCountry = '';
let selectedDuration = 3;

// Load itineraries data
fetch('/data/test-itineraries.json')
  .then(response => response.json())
  .then(data => {
    allItineraries = data.itineraries || [];
    renderItineraries();
  })
  .catch(error => {
    console.error('Error loading itineraries:', error);
    document.getElementById('itinerary-grid').innerHTML = '<div class="empty-state"><p>Error loading itineraries. Please refresh the page.</p></div>';
  });

// Country selector
document.getElementById('country-select').addEventListener('change', (e) => {
  selectedCountry = e.target.value;
  renderItineraries();
});

// Duration buttons
document.querySelectorAll('.duration-btn').forEach(button => {
  button.addEventListener('click', (e) => {
    document.querySelectorAll('.duration-btn').forEach(btn => btn.classList.remove('active'));
    e.target.classList.add('active');
    selectedDuration = parseInt(e.target.dataset.duration);
    renderItineraries();
  });
});

// Filter and render itineraries
function renderItineraries() {
  const filtered = allItineraries.filter(it => 
    (!selectedCountry || it.country === selectedCountry) && 
    it.duration === selectedDuration
  );

  const grid = document.getElementById('itinerary-grid');
  
  if (filtered.length === 0) {
    grid.innerHTML = '<div class="empty-state"><p>No itineraries found for your selection. Try different filters.</p></div>';
    return;
  }

  grid.innerHTML = filtered.map(it => 
    <div class="card">
      <div class="card-header">
        <h3> </h3>
        <div class="duration"> Days</div>
        <div class="badge"></div>
      </div>
      <div class="card-body">
        <h4></h4>
        <p></p>
      </div>
    </div>
  ).join('');
}
</script>

</body>
</html>
