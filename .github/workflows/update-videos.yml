name: Update YouTube Videos

on:
  schedule:
    # Run every 6 hours
    - cron: '0 */6 * * *'
  workflow_dispatch:
    # Allow manual trigger

jobs:
  update-videos:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Fetch YouTube Videos
        run: |
          cat > fetch-videos.cjs << 'EOF'
          const https = require('https');
          const fs = require('fs');

          // YouTube channel ID
          const channelId = 'UCUABrODa0CNF5zgkesAlYeA';
          const feedUrl = `https://www.youtube.com/feeds/videos.xml?channel_id=${channelId}`;

          function fetchFeed(url) {
            return new Promise((resolve, reject) => {
              https.get(url, (res) => {
                let data = '';
                res.on('data', chunk => data += chunk);
                res.on('end', () => resolve(data));
              }).on('error', reject);
            });
          }

          async function updateVideos() {
            try {
              console.log('📺 Fetching YouTube RSS feed...');
              const xmlData = await fetchFeed(feedUrl);

              // Debug: check if we got valid XML
              console.log('Feed received, length:', xmlData.length);
              console.log('First 500 chars:', xmlData.substring(0, 500));

              // Simple XML parsing (xml2js not available in base runner)
              const videos = [];

              // Extract entries using regex - try different patterns
              const entryRegex = /<entry>([\s\S]*?)<\/entry>/g;
              let match;
              let count = 0;
              let entryCount = 0;

              while ((match = entryRegex.exec(xmlData)) && count < 12) {
                entryCount++;
                const entry = match[1];

                // Try multiple patterns for video ID extraction
                let videoId = null;

                // Pattern 1: watch?v=VIDEO_ID
                let linkMatch = entry.match(/watch\?v=([a-zA-Z0-9_-]+)/);
                if (linkMatch) {
                  videoId = linkMatch[1];
                }

                // Pattern 2: /v/VIDEO_ID
                if (!videoId) {
                  linkMatch = entry.match(/\/v\/([a-zA-Z0-9_-]+)/);
                  if (linkMatch) {
                    videoId = linkMatch[1];
                  }
                }

                // Pattern 3: videoId from yt:videoId tag
                if (!videoId) {
                  linkMatch = entry.match(/<yt:videoId>([a-zA-Z0-9_-]+)<\/yt:videoId>/);
                  if (linkMatch) {
                    videoId = linkMatch[1];
                  }
                }

                if (!videoId) {
                  console.log(`Entry ${entryCount}: No video ID found`);
                  continue;
                }

                // Extract title
                const titleMatch = entry.match(/<title>([^<]+)<\/title>/);
                const title = titleMatch ? titleMatch[1].trim() : `Video ${count + 1}`;

                console.log(`Found video ${count + 1}: ${title} (${videoId})`);

                videos.push({
                  id: videoId,
                  title: title,
                  category: 'Travel',
                  type: 'Latest'
                });

                count++;
              }

              console.log(`Processed ${entryCount} entries, found ${videos.length} videos`);

              // If no videos found from feed, keep existing data
              if (videos.length === 0) {
                console.log('⚠️  No videos found from feed, keeping existing data');
                process.exit(0);
              }

              // Write to JSON file
              fs.writeFileSync('videos-data.json', JSON.stringify(videos, null, 2));
              console.log(`✅ Successfully updated ${videos.length} videos`);
              console.log('Videos:');
              videos.forEach((v, i) => console.log(`  ${i + 1}. ${v.title} (${v.id})`));
            } catch (error) {
              console.error('❌ Error fetching videos:', error.message);
              console.error(error);
              process.exit(1);
            }
          }

          updateVideos();
          EOF

          node fetch-videos.cjs

      - name: Commit and push changes
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add videos-data.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore: update YouTube videos" && git push)
