name: Update YouTube Videos

on:
  schedule:
    # Run every 6 hours
    - cron: '0 */6 * * *'
  workflow_dispatch:
    # Allow manual trigger

concurrency:
  group: update-videos
  cancel-in-progress: false

jobs:
  update-videos:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # build-sitemap reads each page's last commit date

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Fetch YouTube Videos
        run: node scripts/fetch-videos.cjs

      - name: Build video pages and video sitemap
        run: node scripts/build-video-pages.cjs

      - name: Build sitemap
        run: node scripts/build-sitemap.cjs

      - name: Commit and push changes
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add videos-data.json videos/ sitemap_videos.xml sitemap.xml
          git diff --staged --quiet || (git commit -m "chore: update YouTube videos" && git pull --rebase && git push)
