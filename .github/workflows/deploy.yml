name: Deploy to AWS

on:
  push:
    branches:
      - main
    paths:
      - '**.html'
      - '**.css'
      - '**.js'
      - '**.json'
      - '**.xml'
      - '**.png'
      - '**.jpg'
      - '**.jpeg'
      - '**.webp'
      - 'terraform/**'

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::604218333793:role/github-actions-role
          aws-region: us-east-1

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v2
        with:
          terraform_version: ~> 1.5.0

      - name: Terraform Init
        working-directory: ./terraform
        run: terraform init

      - name: Terraform Plan
        working-directory: ./terraform
        run: terraform plan -out=tfplan

      - name: Terraform Apply
        working-directory: ./terraform
        run: terraform apply -auto-approve tfplan

      - name: Sync additional files to S3 (if not covered by Terraform)
        run: |
          BUCKET=$(aws s3 ls | grep website | awk '{print $3}')
          aws s3 sync . s3://$BUCKET/ --exclude '.git/*' --exclude 'terraform/*' --exclude 'node_modules/*' --exclude '.github/*' --exclude '.*' --delete

      - name: Get CloudFront Distribution ID from Terraform outputs
        working-directory: ./terraform
        run: terraform output -json > outputs.json

      - name: Invalidate CloudFront cache
        run: |
          DISTRIBUTION_ID=$(cat terraform/outputs.json | jq -r '.cloudfront_distribution_id.value' 2>/dev/null || echo "")
          if [ ! -z "$DISTRIBUTION_ID" ] && [ "$DISTRIBUTION_ID" != "null" ]; then
            aws cloudfront create-invalidation --distribution-id $DISTRIBUTION_ID --paths "/*"
            echo "✅ CloudFront cache invalidated for distribution $DISTRIBUTION_ID"
          else
            echo "⚠️  Could not find CloudFront distribution ID, skipping cache invalidation"
          fi
