name: Deploy site

# Publishes the site to GitHub Pages. Replaces GitHub's built-in "pages build and
# deployment" job (which still runs on the deprecated Node.js 20) and needs
# Settings → Pages → Source set to "GitHub Actions".
# Commits made by other workflows don't trigger "push", so it also runs after them.

on:
  push:
    branches: [main]
  workflow_run:
    workflows: ['Rebuild site', 'Update YouTube Videos', 'Minify CSS and JS', 'Monthly Singapore events page', 'Fetch Destination Images']
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url || steps.deployment-retry.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main   # always publish the latest main, including commits made by other workflows

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: site   # only the site/ folder is published

      - id: deployment
        uses: actions/deploy-pages@v5
        continue-on-error: true

      # GitHub occasionally can't find the just-uploaded files for a few seconds; wait and try once more
      - name: Retry deploy after a short wait
        if: steps.deployment.outcome == 'failure'
        run: sleep 30

      - id: deployment-retry
        if: steps.deployment.outcome == 'failure'
        uses: actions/deploy-pages@v5
