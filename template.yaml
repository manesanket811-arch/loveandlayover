AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2010-05-13
Description: 'Love and Layovers - Travel Website Backend'

Globals:
  Function:
    Timeout: 30
    Runtime: python3.11
    Environment:
      Variables:
        REGION: !Ref AWS::Region

Resources:
  # DynamoDB Tables
  SubscribersTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: love-and-layovers-subscribers
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: email
          AttributeType: S
      KeySchema:
        - AttributeName: email
          KeyType: HASH
      StreamSpecification:
        StreamViewType: NEW_AND_OLD_IMAGES

  ContactsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: love-and-layovers-contacts
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: contact_id
          AttributeType: S
        - AttributeName: submitted_at
          AttributeType: S
      KeySchema:
        - AttributeName: contact_id
          KeyType: HASH
      GlobalSecondaryIndexes:
        - IndexName: submitted_at-index
          KeySchema:
            - AttributeName: submitted_at
              KeyType: HASH
          Projection:
            ProjectionType: ALL

  DownloadsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: love-and-layovers-downloads
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: download_id
          AttributeType: S
        - AttributeName: email
          AttributeType: S
      KeySchema:
        - AttributeName: download_id
          KeyType: HASH
      GlobalSecondaryIndexes:
        - IndexName: email-index
          KeySchema:
            - AttributeName: email
              KeyType: HASH
          Projection:
            ProjectionType: ALL

  # S3 Bucket for Itineraries
  ItinerariesBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub 'love-and-layovers-itineraries-${AWS::AccountId}'
      VersioningConfiguration:
        Status: Enabled
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true

  # Lambda Function
  APIFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: love-and-layovers-api
      CodeUri: .
      Handler: lambda_handler.lambda_handler
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref SubscribersTable
        - DynamoDBCrudPolicy:
            TableName: !Ref ContactsTable
        - DynamoDBCrudPolicy:
            TableName: !Ref DownloadsTable
        - S3ReadPolicy:
            BucketName: !Ref ItinerariesBucket
        - SESEmailTemplateCrudPolicy: {}
        - SESCrudPolicy:
            IdentityName: hello@loveandlayovers.com
      Events:
        SubscribeAPI:
          Type: Api
          Properties:
            RestApiId: !Ref APIGateway
            Path: /subscribe
            Method: POST
        SubscribeOptions:
          Type: Api
          Properties:
            RestApiId: !Ref APIGateway
            Path: /subscribe
            Method: OPTIONS
        ContactAPI:
          Type: Api
          Properties:
            RestApiId: !Ref APIGateway
            Path: /contact
            Method: POST
        ContactOptions:
          Type: Api
          Properties:
            RestApiId: !Ref APIGateway
            Path: /contact
            Method: OPTIONS
        DownloadAPI:
          Type: Api
          Properties:
            RestApiId: !Ref APIGateway
            Path: /download-itinerary
            Method: POST
        DownloadOptions:
          Type: Api
          Properties:
            RestApiId: !Ref APIGateway
            Path: /download-itinerary
            Method: OPTIONS

  # API Gateway
  APIGateway:
    Type: AWS::ApiGateway::RestApi
    Properties:
      Name: love-and-layovers-api
      EndpointConfiguration:
        Types:
          - REGIONAL
      Policy:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: '*'
            Action: 'execute-api:Invoke'
            Resource: '*'

  # CloudFront Distribution for Website
  WebsiteDistribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        HttpVersion: http2
        Origins:
          - Id: S3Origin
            DomainName: !Sub 'love-and-layovers-website-${AWS::AccountId}.s3.amazonaws.com'
            S3OriginConfig:
              OriginAccessIdentity: !Sub 'origin-access-identity/cloudfront/${CloudFrontOAI}'
          - Id: APIOrigin
            DomainName: !Sub '${APIGateway}.execute-api.${AWS::Region}.amazonaws.com'
            CustomOriginConfig:
              HTTPPort: 80
              OriginProtocolPolicy: https-only
        DefaultCacheBehavior:
          AllowedMethods:
            - GET
            - HEAD
            - OPTIONS
          CachedMethods:
            - GET
            - HEAD
          TargetOriginId: S3Origin
          ViewerProtocolPolicy: redirect-to-https
          ForwardedValues:
            QueryString: false
          Compress: true
        CacheBehaviors:
          - PathPattern: '/api/*'
            AllowedMethods:
              - GET
              - HEAD
              - OPTIONS
              - PUT
              - POST
              - PATCH
              - DELETE
            CachedMethods:
              - GET
              - HEAD
            TargetOriginId: APIOrigin
            ViewerProtocolPolicy: https-only
            ForwardedValues:
              QueryString: true
              Headers:
                - Authorization
                - Content-Type
        ViewerCertificate:
          CloudFrontDefaultCertificate: true

  CloudFrontOAI:
    Type: AWS::CloudFront::CloudFrontOriginAccessIdentity
    Properties:
      CloudFrontOriginAccessIdentityConfig:
        Comment: !Sub 'CloudFront OAI for Love and Layovers'

  # Website S3 Bucket
  WebsiteBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub 'love-and-layovers-website-${AWS::AccountId}'
      VersioningConfiguration:
        Status: Enabled
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true

  WebsiteBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref WebsiteBucket
      PolicyText:
        Statement:
          - Effect: Allow
            Principal:
              CanonicalUser: !GetAtt CloudFrontOAI.S3CanonicalUserId
            Action: 's3:GetObject'
            Resource: !Sub '${WebsiteBucket.Arn}/*'

Outputs:
  APIEndpoint:
    Description: API Gateway endpoint URL
    Value: !Sub 'https://${APIGateway}.execute-api.${AWS::Region}.amazonaws.com/Prod'

  WebsiteURL:
    Description: CloudFront Distribution URL
    Value: !GetAtt WebsiteDistribution.DomainName

  SubscribersTableName:
    Description: DynamoDB Subscribers Table
    Value: !Ref SubscribersTable

  ContactsTableName:
    Description: DynamoDB Contacts Table
    Value: !Ref ContactsTable

  DownloadsTableName:
    Description: DynamoDB Downloads Table
    Value: !Ref DownloadsTable

  ItinerariesBucketName:
    Description: S3 Bucket for Itineraries
    Value: !Ref ItinerariesBucket
