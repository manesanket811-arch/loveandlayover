<style>
:root { --ink:#1a2332; --paper:#fefaf5; --accent:#ff6b35; --secondary:#f7931e; --teal:#0fb6a8; --deep:#0d4f6b; --sky:#ffe9d6; --shadow:rgba(26,35,50,.12); --maxw:1180px; }
* { margin:0; padding:0; box-sizing:border-box; }
html { scroll-behavior:smooth; }
body { font-family:'Inter',sans-serif; background:var(--paper); color:var(--ink); overflow-x:hidden; line-height:1.6; }
h1,h2,h3 { font-family:'Fraunces',serif; line-height:1.1; font-weight:900; letter-spacing:-.02em; }
a { color:inherit; text-decoration:none; }
.wrap { max-width:600px; margin:0 auto; padding:0 24px; }
.links-container { min-height:100vh; background:var(--paper); padding:40px 0; }
.links-header { text-align:center; margin-bottom:50px; }
.links-header h1 { font-size:clamp(1.8rem,5vw,2.5rem); margin-bottom:12px; color:var(--ink); }
.links-header p { font-size:0.95rem; color:var(--ink-soft); max-width:500px; margin:0 auto; }
.links-grid { display:flex; flex-direction:column; gap:16px; }
.link-btn { display:block; padding:20px 24px; background:white; border-radius:12px; border:2px solid transparent; box-shadow:0 2px 8px rgba(31,27,22,0.08); text-align:center; font-weight:600; font-size:1rem; transition:all 0.3s; cursor:pointer; }
.link-btn:hover { transform:translateY(-2px); box-shadow:0 8px 20px rgba(31,27,22,0.15); border-color:var(--accent); }
.link-btn strong { display:block; margin-bottom:6px; color:var(--accent); }
.link-btn .label { color:var(--ink); font-weight:700; }
.link-btn .desc { font-size:0.85rem; color:var(--ink-soft); font-weight:400; margin-top:6px; }
.link-btn--primary { background:linear-gradient(135deg,var(--accent),var(--secondary)); color:white; }
.link-btn--primary:hover { transform:translateY(-2px); box-shadow:0 12px 28px rgba(255,107,53,0.3); }
.link-btn--primary strong { color:white; }
.link-btn--primary .label { color:white; }
.link-btn--primary .desc { color:rgba(255,255,255,0.95); }
.link-btn--secondary { opacity:0.8; }
.link-btn--secondary:hover { opacity:1; }
footer { background:var(--ink); color:#9fb0b5; padding:30px 0; margin-top:60px; text-align:center; font-size:0.85rem; }
footer a { color:var(--secondary); }
@media(max-width:600px) { .links-container { padding:30px 0; } .links-header { margin-bottom:40px; } .links-header h1 { font-size:1.6rem; } .link-btn { padding:18px 20px; font-size:0.95rem; } }
</style>
</head>
<body>

<div class="links-container">
  <div class="wrap">
    <!-- Header -->
    <div class="links-header">
      <h1>Love and Layovers</h1>
      <p>Free itineraries from real trips. No fluff, no affiliate links—just honest travel planning.</p>
    </div>

    <!-- Links Grid -->
    <div class="links-grid" id="linksGrid"></div>
  </div>
</div>

<footer>
  <div class="wrap">
    <p>&copy; 2026 Love and Layovers · Travel tips with heart ✈</p>
  </div>
</footer>

<script>
const linksList = [
  {
    label: "Follow @loveandlayover",
    url: "https://www.instagram.com/loveandlayover",
    description: "Instagram",
    style: "primary"
  },
  {
    label: "Subscribe on YouTube",
    url: "https://www.youtube.com/@loveandlayover",
    description: "New destination guide every week",
    style: "primary"
  },
  {
    label: "Build Your Free Itinerary",
    url: "https://www.loveandlayover.in/itinerary-builder.html",
    description: "Plan your next trip",
    style: "primary"
  },
  {
    label: "Browse Destination Guides",
    url: "https://www.loveandlayover.in/destinations/",
    description: "16 destinations, all free",
    style: "primary"
  },
  {
    label: "Scentopia collaboration",
    url: "",
    description: "Behind-the-scenes fragrance museum experience",
    style: "secondary"
  },
  {
    label: "Imagica collaboration",
    url: "",
    description: "Full-day theme park collaboration",
    style: "secondary"
  },
  {
    label: "Follow Nikita's personal account",
    url: "https://www.instagram.com/nikita.lagaskar",
    description: "Everyday lifestyle & dining",
    style: "secondary"
  },
  {
    label: "Let's collaborate",
    url: "mailto:theloveandlayover@gmail.com?subject=Brand Collaboration - Love and Layovers",
    description: "Brand partnership inquiries",
    style: "primary"
  }
];

const linksGrid = document.getElementById('linksGrid');
if (linksGrid) {
  linksList.forEach(link => {
    const btn = document.createElement('a');
    btn.href = link.url || '#';
    btn.className = `link-btn link-btn--${link.style}`;

    if (!link.url) {
      btn.style.opacity = '0.5';
      btn.style.cursor = 'default';
      btn.style.pointerEvents = 'none';
    }

    btn.innerHTML = `
      <span class="label">${link.label}</span>
      ${link.description ? `<span class="desc">${link.description}</span>` : ''}
    `;

    if (link.url) {
      btn.target = link.url.startsWith('http') ? '_blank' : '_self';
      btn.rel = link.url.startsWith('http') ? 'noopener noreferrer' : '';
    }

    linksGrid.appendChild(btn);
  });
}
</script>

</body>
</html>
